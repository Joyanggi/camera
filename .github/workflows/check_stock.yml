name: Check stock

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_slack:
        description: "Send a one-off Slack test message and skip stock checks"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r aggregator/requirements.txt

      - name: Run aggregator
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_SLACK: ${{ inputs.test_slack }}
        run: python aggregator/check_all.py

      - name: Commit status.json if changed
        run: |
          if [ -z "$(git status --porcelain status.json)" ]; then
            echo "No status changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "chore(status): update at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 3
          done
